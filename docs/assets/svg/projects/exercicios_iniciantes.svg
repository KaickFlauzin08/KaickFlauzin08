<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="100%" height="200" role="img" aria-label="Cartão do projeto Exercicios-Iniciantes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#0b1220"/></linearGradient>
    <style>
      .n{font:700 21px 'Segoe UI',Arial,sans-serif;fill:#f8fafc}
      .d{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#94a3b8}
      .l{font:600 12px monospace;fill:#22c55e;letter-spacing:1px}
      .c{font:600 12px monospace;fill:#64748b;letter-spacing:2px}
    </style>
  </defs>
  <rect x="2" y="2" width="476" height="196" rx="16" fill="url(#bg)" stroke="#22c55e" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="2" y="2" width="8" height="196" rx="4" fill="#22c55e" opacity="0.9"/>
  <text x="34" y="46" class="c">REPOSITÓRIO</text>
  <text x="34" y="86" class="n">Exercicios-Iniciantes</text>
  <text x="34" y="116" class="d">Atividades de nível iniciante para fixar os fundamentos.</text>
  <circle cx="40" cy="160" r="6" fill="#22c55e"><animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite"/></circle>
  <text x="56" y="165" class="l">CSS</text>
  <text x="446" y="165" text-anchor="end" class="c">VER →</text>
</svg>

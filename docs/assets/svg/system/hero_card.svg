<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="300" role="img" aria-label="Cartão de apresentação de Kaick Flauzino: estudante, programador e eterno aprendiz">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#020617"/><stop offset="100%" stop-color="#0b1220"/></linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#334155"/><stop offset="50%" stop-color="#22d3ee"/><stop offset="75%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#334155"/></linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#22d3ee"/><stop offset="55%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#38bdf8" stroke-opacity="0.05"/></pattern>
    <style>
      .mono{font:500 15px monospace;fill:#94a3b8}
      .prompt{font:700 15px monospace;fill:#22d3ee}
      .name{font:700 44px 'Segoe UI',Arial,sans-serif;fill:url(#name);letter-spacing:2px}
      .tag{font:500 17px 'Segoe UI',Arial,sans-serif;fill:#cbd5e1}
      .chip{font:600 13px monospace;fill:#e2e8f0}
    </style>
  </defs>
  <rect width="1000" height="300" fill="url(#bg)"/>
  <rect width="1000" height="300" fill="url(#grid)"/>
  <rect x="20" y="20" width="960" height="260" rx="18" fill="rgba(2,6,23,0.6)" stroke="url(#stroke)" stroke-width="2"/>

  <circle cx="50" cy="48" r="6" fill="#fb7185"/><circle cx="72" cy="48" r="6" fill="#f59e0b"/><circle cx="94" cy="48" r="6" fill="#22c55e"/>
  <text x="130" y="53" class="mono">kaick@github:~$ whoami</text>

  <text x="60" y="130" class="name">Kaick Flauzino</text>
  <text x="60" y="168" class="tag">Estudante • Programador • Eterno aprendiz</text>
  <text x="60" y="196" class="tag">Construindo o futuro da web, um código de cada vez.</text>

  <g transform="translate(60,226)">
    <rect width="120" height="30" rx="15" fill="#0f172a" stroke="#22d3ee"/><text x="60" y="20" text-anchor="middle" class="chip">JavaScript</text>
    <rect x="132" width="80" height="30" rx="15" fill="#0f172a" stroke="#8b5cf6"/><text x="172" y="20" text-anchor="middle" class="chip">React</text>
    <rect x="224" width="100" height="30" rx="15" fill="#0f172a" stroke="#ec4899"/><text x="274" y="20" text-anchor="middle" class="chip">HTML + CSS</text>
    <rect x="336" width="104" height="30" rx="15" fill="#0f172a" stroke="#22c55e"/><text x="388" y="20" text-anchor="middle" class="chip">Aprendendo</text>
  </g>

  <text x="760" y="226" class="prompt">&gt;</text>
  <rect x="776" y="212" width="10" height="18" fill="#22d3ee">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <g transform="translate(860,110)">
    <circle r="52" fill="none" stroke="#1e293b" stroke-width="2"/>
    <circle r="40" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="26 12">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle r="16" fill="#22d3ee" opacity="0.9"><animate attributeName="r" values="14;18;14" dur="4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
